# agent-router dispatch table
# version: 1
# Last updated: 2026-05-04
#
# Format:
#   threshold: <float>           # Minimum confidence to return a non-fallback agent (0.0–1.0)
#   saturation: <float>          # Score above this saturates confidence at 1.0
#   specialty_boost: <float>     # Bonus per extra keyword that hits the same agent
#   fallback: <agent_name>       # Returned when no candidate clears threshold
#   keywords:
#     <keyword>: <agent_name>    # Word-boundary match, lowercased
#     <keyword>: { agent: <name>, weight: <float> }
#
# Keywords are lowercased and matched on word boundaries (\b<keyword>\b).
# Multi-word keywords (e.g. "code review") are matched as the literal phrase.
# Hyphens / underscores are treated as part of the token.
#
# When you ARCHIVE an agent under docs/archive/agents/, REMOVE its keywords here
# so the router degrades to general-purpose instead of returning a dead agent.

threshold: 0.25
saturation: 3.0
specialty_boost: 0.6
fallback: general-purpose

