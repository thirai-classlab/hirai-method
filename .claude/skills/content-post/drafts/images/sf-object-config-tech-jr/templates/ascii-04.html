<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>レコードタイプ 設計例</title>
<link rel="stylesheet" href="sketchnote.css">
<style>
  html, body { width: 3072px; height: 1728px; overflow: visible; margin: 0; }
  body { width: 3072px; height: 1728px; }
  .canvas { width: 3072px !important; height: 1728px !important; padding: 70px 110px !important; overflow: visible !important; box-sizing: border-box; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 50px; gap: 40px; }
  .title { font-size: 86px; line-height: 1.18; }
  .subtitle { font-size: 38px; margin-top: 14px; }

  .badge-tilt {
    background: #ebdcf3;
    border: 4px solid var(--purple);
    border-radius: 32px 38px 30px 36px;
    padding: 22px 34px;
    font-family: 'Yusei Magic', sans-serif;
    font-size: 34px;
    color: #6e3f96;
    box-shadow: 6px 6px 0 var(--purple);
    transform: rotate(4deg);
    text-align: center;
    line-height: 1.25;
    flex-shrink: 0;
    margin-top: 24px;
  }

  /* 比較カード行 */
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 70px;
    margin-bottom: 50px;
  }

  .card {
    border: 6px solid var(--ink);
    border-radius: 30px;
    background: white;
    box-shadow: 10px 10px 0 var(--ink);
    padding: 36px 44px;
    position: relative;
    display: flex; flex-direction: column; gap: 20px;
  }
  .card.left { border-color: #2670ba; box-shadow: 10px 10px 0 #2670ba; background: #f0f7fd; }
  .card.right { border-color: #6e3f96; box-shadow: 10px 10px 0 #6e3f96; background: #f7f0fb; }

  .card .ribbon {
    position: absolute;
    top: -28px; left: 36px;
    padding: 12px 32px;
    font-family: 'Yusei Magic', sans-serif;
    font-size: 30px;
    color: white;
    border: 4px solid var(--ink);
    border-radius: 30px;
    box-shadow: 4px 4px 0 var(--ink);
    letter-spacing: 0.06em;
  }
  .card.left .ribbon { background: #4a90d9; }
  .card.right .ribbon { background: #a06fbf; }

  .card .heading {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 64px; font-weight: 700;
    line-height: 1.1; margin-top: 20px;
  }
  .card.left .heading { color: #2670ba; }
  .card.right .heading { color: #6e3f96; }

  .row {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 20px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 3px dashed #bbb;
  }
  .row:last-child { border-bottom: none; }
  .row .lbl {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 36px;
    color: #555;
  }
  .row .val {
    font-family: 'Klee One', sans-serif;
    font-size: 36px;
    font-weight: 600;
    color: var(--ink);
  }
  .stage-pills { display: flex; gap: 12px; flex-wrap: wrap; }
  .stage-pill {
    background: white;
    border: 3px solid currentColor;
    border-radius: 18px;
    padding: 10px 22px;
    font-family: 'Klee One', sans-serif;
    font-size: 28px;
    font-weight: 600;
    box-shadow: 3px 3px 0 currentColor;
  }
  .card.left .stage-pill { color: #2670ba; }
  .card.right .stage-pill { color: #6e3f96; }

  .req-pill {
    display: inline-block;
    background: #ffd6d6;
    border: 4px solid #d04545;
    color: #b03030;
    border-radius: 22px;
    padding: 10px 28px;
    font-family: 'Yusei Magic', sans-serif;
    font-size: 36px;
    font-weight: 700;
    box-shadow: 4px 4px 0 #d04545;
  }

  .layout-pill {
    display: inline-block;
    background: white;
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 8px 22px;
    font-family: 'Klee One', sans-serif;
    font-size: 32px;
    font-weight: 600;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .hint {
    background: #fff9d6;
    border: 4px dashed #c89000;
    border-radius: 26px;
    padding: 26px 40px;
    text-align: center;
    font-family: 'Klee One', sans-serif;
    font-size: 34px;
    color: #6a4a00;
    line-height: 1.5;
    box-shadow: 4px 4px 0 rgba(200,144,0,0.4);
  }
  .hint .tip-icon { font-size: 40px; margin-right: 10px; }
  .hint strong {
    color: #b03030;
    font-family: 'Yusei Magic', sans-serif;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="head">
    <div>
      <div class="title"><span class="star-mark">✦</span>レコードタイプ 設計例 — 「新規契約」と「更新契約」を分岐</div>
      <div class="subtitle">同じオブジェクトでもレコードタイプを分けて<br>レイアウト / フェーズ / 必須項目を切り替え</div>
    </div>
    <div class="badge-tilt">同じ箱でも<br>用途で分岐！</div>
  </div>

  <div class="compare">
    <!-- 左: 新規契約 -->
    <div class="card left">
      <div class="ribbon">レコードタイプ 1</div>
      <div class="heading">新規契約 (New)</div>

      <div class="row">
        <div class="lbl">📄 ページレイアウト</div>
        <div class="val"><span class="layout-pill">Sales New</span></div>
      </div>

      <div class="row">
        <div class="lbl">🚀 フェーズ</div>
        <div class="stage-pills">
          <div class="stage-pill">検討</div>
          <div class="stage-pill">交渉/レビュー</div>
          <div class="stage-pill">受注</div>
          <div class="stage-pill">失注</div>
        </div>
      </div>

      <div class="row">
        <div class="lbl">⭐ 必須項目</div>
        <div class="val"><span class="req-pill">顧客紹介経路</span></div>
      </div>
    </div>

    <!-- 右: 更新契約 -->
    <div class="card right">
      <div class="ribbon">レコードタイプ 2</div>
      <div class="heading">更新契約 (Renew)</div>

      <div class="row">
        <div class="lbl">📄 ページレイアウト</div>
        <div class="val"><span class="layout-pill">Sales Renew</span></div>
      </div>

      <div class="row">
        <div class="lbl">🚀 フェーズ</div>
        <div class="stage-pills">
          <div class="stage-pill">レビュー保留中</div>
          <div class="stage-pill">受注</div>
          <div class="stage-pill">失注</div>
        </div>
      </div>

      <div class="row">
        <div class="lbl">⭐ 必須項目</div>
        <div class="val"><span class="req-pill">前契約 ID</span></div>
      </div>
    </div>
  </div>

  <div class="hint">
    <span class="tip-icon">💡</span>
    レコードタイプは<strong>増やしすぎない</strong> — 3〜5 個が目安、10 個超は保守困難
  </div>
</div>
</body>
</html>
