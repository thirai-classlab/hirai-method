<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>項目の連動関係</title>
<link rel="stylesheet" href="sketchnote.css">
<style>
  html, body { width: 3072px; height: 1728px; overflow: visible; margin: 0; }
  body { width: 3072px; height: 1728px; }
  .canvas { width: 3072px !important; height: 1728px !important; padding: 80px 130px !important; overflow: visible !important; box-sizing: border-box; }

  .head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; gap: 40px; }
  .title { font-size: 100px; line-height: 1.18; }
  .subtitle { font-size: 40px; margin-top: 16px; }

  .badge-tilt {
    background: #ffd6e5;
    border: 4px solid var(--pink);
    border-radius: 32px 38px 30px 36px;
    padding: 22px 36px;
    font-family: 'Yusei Magic', sans-serif;
    font-size: 36px;
    color: #c84777;
    box-shadow: 6px 6px 0 var(--pink);
    transform: rotate(3deg);
    text-align: center;
    line-height: 1.25;
    flex-shrink: 0;
    margin-top: 30px;
  }

  /* 列ヘッダ */
  .colheader {
    display: grid;
    grid-template-columns: 900px 280px 1fr;
    gap: 50px;
    align-items: end;
    margin-bottom: 24px;
  }
  .colheader .col1 {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 50px; font-weight: 700; color: #2670ba;
    border-bottom: 4px dashed var(--blue);
    padding-bottom: 8px;
  }
  .colheader .col2 {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 32px; color: #555; text-align: center;
  }
  .colheader .col3 {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 50px; font-weight: 700; color: #c5651a;
    border-bottom: 4px dashed var(--orange);
    padding-bottom: 8px;
  }

  /* 行 */
  .rows { display: flex; flex-direction: column; gap: 28px; }
  .row {
    display: grid;
    grid-template-columns: 900px 280px 1fr;
    gap: 50px;
    align-items: stretch;
  }

  /* 制御項目カード */
  .ctrl {
    background: #b8d4f0;
    border: 5px solid #2670ba;
    border-radius: 28px 32px 26px 30px;
    padding: 24px 36px;
    box-shadow: 8px 8px 0 #2670ba;
    display: flex; flex-direction: column; justify-content: center;
  }
  .ctrl .ctrl-lbl {
    font-family: 'Klee One', sans-serif;
    font-size: 32px; color: #1a4d80; font-weight: 600;
    margin-bottom: 6px;
  }
  .ctrl .ctrl-val {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 78px; font-weight: 700;
    color: #1a3a66;
    line-height: 1.05;
  }

  /* 矢印 */
  .arrow-cell {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px;
  }
  .arrow-cell .big-arrow {
    font-size: 110px; color: var(--ink); font-weight: 900; line-height: 0.8;
  }
  .arrow-cell .label-bottom {
    font-family: 'Yusei Magic', sans-serif; font-size: 30px; color: #c84777;
    border: 3px solid var(--pink); background: #ffd6e5;
    border-radius: 22px; padding: 6px 22px;
    box-shadow: 3px 3px 0 var(--pink);
  }

  /* 候補リスト */
  .candidates {
    background: #ffe89c;
    border: 5px solid #c89000;
    border-radius: 28px 32px 26px 30px;
    padding: 24px 32px;
    box-shadow: 8px 8px 0 #c89000;
    display: flex; flex-direction: column; justify-content: center;
  }
  .candidates .clbl {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 30px; color: #8a6a00; margin-bottom: 14px;
  }
  .pills { display: flex; gap: 18px; flex-wrap: wrap; }
  .pill {
    background: white;
    border: 3px solid var(--ink);
    border-radius: 36px;
    padding: 12px 28px;
    font-family: 'Klee One', sans-serif;
    font-size: 36px; font-weight: 600;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .pill.dots { font-size: 40px; padding: 8px 24px; letter-spacing: 4px; }

  /* footer path */
  .path-block {
    margin-top: 50px;
    background: #fffce8;
    border: 4px dashed #aaa;
    border-radius: 26px;
    padding: 26px 40px;
    text-align: center;
    font-family: 'Klee One', sans-serif;
    font-size: 32px;
    color: #444;
    line-height: 1.55;
  }
  .path-block .lead {
    font-family: 'Yusei Magic', sans-serif;
    color: #6e3f96;
    font-size: 36px;
    margin-right: 8px;
  }
  .path-block .arrow {
    color: var(--pink); font-weight: 700; padding: 0 8px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="head">
    <div>
      <div class="title"><span class="star-mark">✦</span>項目の連動関係</div>
      <div class="subtitle">制御項目の値で従属項目の選択肢を絞り込む</div>
    </div>
    <div class="badge-tilt">親で<br>絞り込む！</div>
  </div>

  <div class="colheader">
    <div class="col1">★ Country (制御)</div>
    <div class="col2">→ 絞込 →</div>
    <div class="col3">★ State / Region (従属)</div>
  </div>

  <div class="rows">
    <div class="row">
      <div class="ctrl">
        <div class="ctrl-lbl">Country</div>
        <div class="ctrl-val">🇯🇵 Japan</div>
      </div>
      <div class="arrow-cell">
        <div class="big-arrow">➜</div>
        <div class="label-bottom">絞込</div>
      </div>
      <div class="candidates">
        <div class="clbl">候補</div>
        <div class="pills">
          <div class="pill">東京</div>
          <div class="pill">神奈川</div>
          <div class="pill">大阪</div>
          <div class="pill">福岡</div>
          <div class="pill dots">…</div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="ctrl">
        <div class="ctrl-lbl">Country</div>
        <div class="ctrl-val">🇺🇸 USA</div>
      </div>
      <div class="arrow-cell">
        <div class="big-arrow">➜</div>
        <div class="label-bottom">絞込</div>
      </div>
      <div class="candidates">
        <div class="clbl">候補</div>
        <div class="pills">
          <div class="pill">California</div>
          <div class="pill">Texas</div>
          <div class="pill">NY</div>
          <div class="pill dots">…</div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="ctrl">
        <div class="ctrl-lbl">Country</div>
        <div class="ctrl-val">🇬🇧 UK</div>
      </div>
      <div class="arrow-cell">
        <div class="big-arrow">➜</div>
        <div class="label-bottom">絞込</div>
      </div>
      <div class="candidates">
        <div class="clbl">候補</div>
        <div class="pills">
          <div class="pill">England</div>
          <div class="pill">Scotland</div>
          <div class="pill">Wales</div>
          <div class="pill dots">…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="path-block">
    <span class="lead">📍 設定パス</span>
    設定 <span class="arrow">›</span> オブジェクトマネージャ <span class="arrow">›</span> 対象オブジェクト <span class="arrow">›</span> 項目とリレーション <span class="arrow">›</span> 項目の連動関係 <span class="arrow">›</span> 新規
  </div>
</div>
</body>
</html>
