<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>4段モデル</title>
<link rel="stylesheet" href="sketchnote.css">
<style>
  body { width: 2560px; height: 1440px; }
  .canvas { width: 2560px; height: 1440px; padding: 80px 120px; }
  .stack { display: flex; flex-direction: column; gap: 28px; margin-top: 30px; }
  .layer {
    border-radius: 28px;
    padding: 36px 44px;
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    display: flex;
    align-items: center;
    gap: 36px;
  }
  .layer .num {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 56px;
    font-weight: 700;
    width: 100px;
    text-align: center;
    border: 4px dashed currentColor;
    border-radius: 50%;
    aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
    background: white;
  }
  .layer .lbl {
    font-family: 'Yusei Magic', sans-serif;
    font-size: 64px;
    font-weight: 700;
    min-width: 320px;
  }
  .layer .items {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 32px;
  }
  .layer .items .item {
    background: white;
    border: 3px solid currentColor;
    border-radius: 20px;
    padding: 8px 22px;
  }
  .layer .icon { font-size: 56px; }
  .L1 { background: #fff5db; border-color: #d49a1a; box-shadow: 6px 6px 0 #d49a1a; color: #b07c00; }
  .L2 { background: #d6e8f7; border-color: #4a90d9; box-shadow: 6px 6px 0 #4a90d9; color: #2670ba; }
  .L3 { background: #ffe5ee; border-color: #ff6b9d; box-shadow: 6px 6px 0 #ff6b9d; color: #d04777; }
  .L4 { background: #d8f0e7; border-color: #4fb59c; box-shadow: 6px 6px 0 #4fb59c; color: #2d8a72; }
  .arrow-up {
    text-align: center;
    font-size: 48px;
    color: var(--ink);
    margin: -8px 0;
  }
  .badge {
    position: absolute;
    top: 90px; right: 110px;
    background: var(--yellow-bg);
    border: 3px solid var(--yellow);
    border-radius: 50%;
    padding: 18px 22px;
    font-family: 'Yusei Magic', sans-serif;
    font-size: 28px;
    color: #8a6a00;
    box-shadow: 4px 4px 0 var(--yellow);
    transform: rotate(8deg);
    text-align: center;
    line-height: 1.2;
  }
  .tagline {
    margin-top: 30px;
    text-align: center;
    font-family: 'Yusei Magic', sans-serif;
    font-size: 32px;
    color: #555;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="title xl"><span class="star-mark">✦</span>Salesforce オブジェクト設定 — 4 段モデル</div>
  <div class="subtitle lg">下から順に積み上げて、業務に合った設定を組み立てる</div>

  <div class="badge">下から<br>積み上げ！</div>

  <div class="stack">
    <div class="layer L4">
      <div class="num">4</div>
      <div class="icon">⚙️</div>
      <div class="lbl">自動化</div>
      <div class="items">
        <div class="item">フロー</div>
        <div class="item">承認プロセス</div>
        <div class="item">Apex</div>
      </div>
    </div>
    <div class="arrow-up">↑</div>
    <div class="layer L3">
      <div class="num">3</div>
      <div class="icon">🛡️</div>
      <div class="lbl">ルール</div>
      <div class="items">
        <div class="item">入力規則</div>
        <div class="item">必須項目</div>
        <div class="item">重複ルール</div>
      </div>
    </div>
    <div class="arrow-up">↑</div>
    <div class="layer L2">
      <div class="num">2</div>
      <div class="icon">🖼️</div>
      <div class="lbl">UI</div>
      <div class="items">
        <div class="item">ページレイアウト</div>
        <div class="item">レコードタイプ</div>
        <div class="item">リストビュー</div>
      </div>
    </div>
    <div class="arrow-up">↑</div>
    <div class="layer L1">
      <div class="num">1</div>
      <div class="icon">🗄️</div>
      <div class="lbl">スキーマ</div>
      <div class="items">
        <div class="item">オブジェクト</div>
        <div class="item">項目</div>
        <div class="item">リレーション</div>
      </div>
    </div>
  </div>

  <div class="tagline">「何を保存するか」→「どう見せるか」→「何を許すか」→「何を自動でやるか」</div>
</div>
</body>
</html>
