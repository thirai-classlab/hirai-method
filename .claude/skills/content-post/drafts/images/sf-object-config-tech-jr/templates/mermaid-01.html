<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Salesforce Admin 認定試験トレーニング</title>
<link rel="stylesheet" href="sketchnote.css">
<style>
  body { width: 1536px; height: 1024px; margin: 0; }
  .canvas { width: 1536px; height: 1024px; padding: 36px 60px; box-sizing: border-box; }

  .header { text-align: center; margin-bottom: 14px; }
  .header .ttl {
    display: inline-block;
    font-family: 'Yusei Magic', 'Klee One', sans-serif;
    font-size: 50px; font-weight: 700; color: #2d2a26;
    background: #fff3b0;
    border: 4px solid #f4c430;
    border-radius: 30px;
    padding: 12px 50px;
    box-shadow: 6px 6px 0 #c89000;
    letter-spacing: 0.03em;
  }
  .header .sm { font-size: 38px; color: #c89000; }
  .header .sub {
    font-family: 'Klee One', sans-serif;
    font-size: 22px; color: #555;
    margin-top: 12px;
  }

  .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }

  .layer {
    border-radius: 22px;
    padding: 16px 26px;
    border: 4px solid #2d2a26;
    box-shadow: 5px 5px 0 #2d2a26;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .layer .icon { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .layer .lbl {
    font-family: 'Yusei Magic', 'Klee One', sans-serif;
    font-size: 38px; font-weight: 700;
    min-width: 200px; line-height: 1.1;
  }
  .layer .lbl .en {
    display: block;
    font-size: 14px; font-weight: 400; color: #666;
    margin-top: 2px; letter-spacing: 0.05em;
  }
  .layer .items {
    display: flex; gap: 12px; flex-wrap: wrap; flex: 1;
  }
  .layer .item {
    background: #ffffff;
    border: 3px solid currentColor;
    border-radius: 16px;
    padding: 8px 18px;
    font-family: 'Klee One', sans-serif;
    font-size: 22px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    line-height: 1.2;
  }
  .layer .item .em { font-size: 24px; }

  .L1 { background: #fff5db; border-color: #d49a1a; box-shadow: 5px 5px 0 #d49a1a; color: #8a6a00; }
  .L2 { background: #d6e8f7; border-color: #4a90d9; box-shadow: 5px 5px 0 #4a90d9; color: #2670ba; }
  .L3 { background: #ffe5ee; border-color: #ff6b9d; box-shadow: 5px 5px 0 #ff6b9d; color: #c44777; }
  .L4 { background: #d8f0e7; border-color: #4fb59c; box-shadow: 5px 5px 0 #4fb59c; color: #2d8a72; }

  .arrow-up {
    text-align: center;
    font-family: 'Yusei Magic', sans-serif;
    font-size: 28px; color: #888;
    margin: -4px 0; line-height: 1;
  }

  .badge {
    position: absolute;
    top: 90px; right: 60px;
    background: #ffe5ee;
    border: 3px solid #ff6b9d;
    border-radius: 50%;
    font-family: 'Yusei Magic', 'Klee One', sans-serif;
    font-size: 18px; font-weight: 700;
    color: #c44777;
    box-shadow: 4px 4px 0 #ff6b9d;
    transform: rotate(8deg);
    text-align: center; line-height: 1.2;
    width: 100px; height: 100px;
    display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }

  .tagwrap { text-align: center; margin-top: 18px; }
  .tag {
    font-family: 'Yusei Magic', 'Klee One', sans-serif;
    font-size: 24px; font-weight: 700;
    color: #555;
    background: #fffce8;
    border: 2.5px dashed #2d2a26;
    border-radius: 20px;
    padding: 12px 32px;
    display: inline-block;
    box-shadow: 3px 3px 0 #2d2a26;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="header">
    <div class="ttl"><span class="sm">✦</span> Salesforce Admin 認定試験 <span class="sm">✦</span></div>
    <div class="sub">主要アーキテクチャを把握して、管理者としての基盤を固める</div>
  </div>

  <div class="badge">下から<br>積み上げ！</div>

  <div class="stack">
    <div class="layer L4">
      <div class="icon">⚙️</div>
      <div class="lbl">自動化<span class="en">Automation</span></div>
      <div class="items">
        <div class="item"><span class="em">🌊</span>フロー</div>
        <div class="item"><span class="em">📋</span>承認プロセス</div>
        <div class="item"><span class="em">🧩</span>Apexトリガ</div>
      </div>
    </div>
    <div class="arrow-up">↑</div>
    <div class="layer L3">
      <div class="icon">🛡️</div>
      <div class="lbl">ルール<span class="en">Rule</span></div>
      <div class="items">
        <div class="item"><span class="em">✅</span>入力規則</div>
        <div class="item"><span class="em">📌</span>必須項目</div>
        <div class="item"><span class="em">🔁</span>重複ルール</div>
      </div>
    </div>
    <div class="arrow-up">↑</div>
    <div class="layer L2">
      <div class="icon">🖼️</div>
      <div class="lbl">UI<span class="en">User Interface</span></div>
      <div class="items">
        <div class="item"><span class="em">📄</span>ページレイアウト</div>
        <div class="item"><span class="em">🗂️</span>レコードタイプ</div>
        <div class="item"><span class="em">📋</span>リストビュー</div>
      </div>
    </div>
    <div class="arrow-up">↑</div>
    <div class="layer L1">
      <div class="icon">🗄️</div>
      <div class="lbl">スキーマ<span class="en">Schema</span></div>
      <div class="items">
        <div class="item"><span class="em">📦</span>オブジェクト</div>
        <div class="item"><span class="em">🏷️</span>項目（フィールド）</div>
        <div class="item"><span class="em">🔗</span>リレーション</div>
      </div>
    </div>
  </div>

  <div class="tagwrap">
    <div class="tag">下から積み上げて、強固な Salesforce 組織を構築 ✦</div>
  </div>
</div>
</body>
</html>
