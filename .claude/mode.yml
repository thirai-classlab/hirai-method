# HIRAI メソッド 動作モード
#
# 設定ファイル 1 枚で動作モードを切替える。slash command `/mode <normal|loop>` でも更新可能。
#
# === 値の意味 ===
# - normal: 通常モード。重要分岐でユーザに確認を求めながら進める。Why × 5 表示は常時 ON。
# - loop  : Loop モード。ユーザの明示的な停止指示までは、AI が推奨する方法を即採用して
#           実装を継続する。中間確認は行わない（Why × 5 表示は維持）。
#           停止条件: (1) ユーザの停止指示  (2) タスク完了  (3) 致命エラー
#
# === 環境変数による上書き ===
# `HC_MODE=loop` で本ファイル値を上書き可能（一時切替向け）。
# 値解決の優先順 (高 → 低): env > YAML > default(normal)

mode: loop

# === Asana 利用モード ===
# このプロジェクトで Asana 連携 (Asana タスク文脈取得 / docs/work.md 自動生成 / Slack スレ取込) を
# 利用するかどうかを per-project で管理。
#
# 値:
# - true   : Asana 連携 ON。/work-init, work-session-check.sh, Asana MCP 関連機能が有効
# - false  : Asana 連携 OFF。上記機能は no-op、ハーネスは Asana 抜きで動作 (OSS / 個人プロジェクト向け)
# - (unset / null) : 未決定。SessionStart hook (mode-asana-prompt.sh) が user に 1 度だけヒアリング
#
# 切替: slash command `/mode asana on` / `/mode asana off` でも更新可能
# 上書き env: `HC_ASANA_ENABLED=true` / `=false`
asana_enabled: false
