<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hc-config 設定</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<!--
  task-76 Step 3-4: 2 分割再設計 (左 preset / 右 category accordion + 上部タブ 設定/履歴)。
  no-scroll: html,body 100% / #app-root 100vh overflow hidden。ページ全体スクロール禁止。
  app.js の querySelector/render target と id を厳密一致させる (task-63 id mismatch 事故の再発防止):
    #status-text #cdn-warning #app-root
    #tab-config #tab-history (role=tab) / #panel-config #panel-history (role=tabpanel)
    #preset-list (左ペイン render target) #category-accordion (右ペイン render target)
    #save-bar #btn-save #btn-cancel #header-state-badge
    #history-tbody (履歴タブ render target)
    #confirm-dialog #confirm-dialog-title #confirm-dialog-body #confirm-dialog-ok #confirm-dialog-cancel
    #toast-container
-->
<body class="bg-slate-50 text-slate-900">
  <!-- skip link (a11y SC 2.4.1) -->
  <a href="#panel-config" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:bg-blue-700 focus:text-white focus:px-3 focus:py-2 focus:rounded">メインコンテンツへスキップ</a>

  <!-- 最上位 container: viewport 100vh 固定、ページ全体スクロール禁止 -->
  <div id="app-root">
    <!-- Header: タイトル + タブ + 状態バッジ -->
    <header class="app-header" role="banner">
      <div class="app-header__title">
        <h1 class="text-base font-bold text-slate-800" lang="ja">hc-config 設定</h1>
        <span class="text-xs text-slate-400">hirai-method harness</span>
      </div>

      <!-- 上部タブ (設定 / 履歴) -->
      <div class="app-tabs" role="tablist" aria-label="表示切替">
        <button id="tab-config" class="app-tab" role="tab" type="button" aria-selected="true" aria-controls="panel-config" tabindex="0">設定</button>
        <button id="tab-history" class="app-tab" role="tab" type="button" aria-selected="false" aria-controls="panel-history" tabindex="-1">履歴</button>
      </div>

      <div class="app-header__status">
        <span id="header-state-badge" class="state-badge" lang="ja">読み込み中</span>
        <span id="status-text" class="text-xs text-slate-500" role="status" aria-live="polite" aria-atomic="true">起動中...</span>
      </div>
    </header>

    <!-- Tailwind CDN offline 警告 -->
    <div id="cdn-warning" class="hidden bg-amber-100 border-b border-amber-300 text-amber-800 text-xs px-4 py-1" role="alert" lang="ja">
      Tailwind CDN に接続できません。レイアウトが崩れる可能性があります (ネット接続 / Proxy / CSP を確認)。
    </div>

    <!-- 設定タブ: 2 分割 (左 preset / 右 category accordion) -->
    <main id="panel-config" class="panel-config" role="tabpanel" aria-labelledby="tab-config" tabindex="0" lang="ja">
      <!-- 左ペイン: プリセット -->
      <aside class="pane-left" role="region" aria-label="プリセット">
        <h2 class="pane-left__heading">プリセット</h2>
        <div id="preset-list" class="pane-left__body">
          <p class="text-sm text-slate-400 px-2 py-1">読み込み中...</p>
        </div>
      </aside>

      <!-- 右ペイン: 実設定値 (category accordion) -->
      <section class="pane-right" role="region" aria-label="実設定値">
        <div id="category-accordion" class="pane-right__body">
          <p class="text-sm text-slate-400 px-2 py-2">読み込み中...</p>
        </div>
        <!-- 保存バー (編集発生時にアクティブ) -->
        <div id="save-bar" class="save-bar">
          <span id="save-bar-note" class="text-xs text-slate-500" lang="ja"></span>
          <div class="save-bar__actions">
            <button id="btn-cancel" type="button" class="btn-cancel" disabled>取消</button>
            <button id="btn-save" type="button" class="btn-save" disabled>保存</button>
          </div>
        </div>
      </section>
    </main>

    <!-- 履歴タブ: 適用 / rollback 履歴 -->
    <main id="panel-history" class="panel-history hidden" role="tabpanel" aria-labelledby="tab-history" tabindex="0" lang="ja">
      <section role="region" aria-labelledby="history-heading">
        <h2 id="history-heading" class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">プリセット適用 / ロールバック履歴</h2>
        <table id="history-table" class="w-full text-sm" aria-describedby="history-heading">
          <caption class="sr-only">プリセット適用履歴一覧 (Timestamp / Preset / Applied / Failed / Rolled back / Action)</caption>
          <thead class="text-xs uppercase text-slate-500 border-b border-slate-200">
            <tr>
              <th scope="col" class="text-left py-1 pr-3">時刻</th>
              <th scope="col" class="text-left py-1 pr-3">プリセット</th>
              <th scope="col" class="text-left py-1 pr-3">適用</th>
              <th scope="col" class="text-left py-1 pr-3">失敗</th>
              <th scope="col" class="text-left py-1 pr-3">復元</th>
              <th scope="col" class="text-left py-1 pr-3">操作</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="6" class="py-2 text-slate-400">履歴を読み込み中...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- confirm dialog (保存 / rollback confirm) -->
  <dialog id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-body" class="rounded-lg shadow-xl p-0 backdrop:bg-slate-900/40" lang="ja">
    <div class="bg-white rounded-lg w-full max-w-lg">
      <header class="px-5 py-3 border-b border-slate-200">
        <h2 id="confirm-dialog-title" class="text-base font-bold text-slate-800">確認</h2>
      </header>
      <div id="confirm-dialog-body" class="px-5 py-4 text-sm text-slate-700 space-y-2"></div>
      <footer class="px-5 py-3 border-t border-slate-200 flex justify-end gap-2 bg-slate-50 rounded-b-lg">
        <button id="confirm-dialog-cancel" type="button" class="px-4 py-2 text-sm bg-slate-200 hover:bg-slate-300 rounded text-slate-800 min-h-[44px]">キャンセル</button>
        <button id="confirm-dialog-ok" type="button" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded min-h-[44px]">実行</button>
      </footer>
    </div>
  </dialog>

  <!-- toast container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none" role="region" aria-label="通知" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
