<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hc-config Web UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10">
    <div class="px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-bold text-slate-800">hc-config Web UI</h1>
        <span class="text-xs text-slate-500">task-61 / hirai-method harness</span>
      </div>
      <div id="status-banner" class="text-sm text-slate-600">
        <span id="status-text">起動中...</span>
      </div>
    </div>
    <!-- Tailwind CDN offline 警告 -->
    <div id="cdn-warning" class="hidden bg-amber-100 border-t border-amber-300 text-amber-800 text-sm px-6 py-2">
      Tailwind CDN に接続できません。レイアウトが崩れる可能性があります (ネット接続 / Proxy / CSP を確認)。
    </div>
  </header>

  <!-- Main grid: sidebar + content -->
  <main class="flex-1 grid grid-cols-[280px_1fr] gap-0 min-h-0">
    <!-- Sidebar -->
    <aside class="bg-white border-r border-slate-200 overflow-y-auto">
      <section class="p-4 border-b border-slate-200">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2">Presets</h2>
        <ul id="preset-list" class="space-y-1 text-sm">
          <li class="text-slate-400">読み込み中...</li>
        </ul>
      </section>
      <section class="p-4">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2">Categories</h2>
        <ul id="category-list" class="space-y-1 text-sm">
          <li class="text-slate-400">読み込み中...</li>
        </ul>
      </section>
    </aside>

    <!-- Content area -->
    <section class="overflow-y-auto p-6">
      <div id="main-panel" class="space-y-4">
        <div class="bg-white rounded-lg border border-slate-200 p-6">
          <p class="text-slate-600">左 sidebar から <strong>Preset</strong> または <strong>Category</strong> を選択してください。</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer: history -->
  <footer class="bg-white border-t border-slate-200 px-6 py-3 max-h-48 overflow-y-auto">
    <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2">Preset Apply History</h2>
    <table id="history-table" class="w-full text-sm">
      <thead class="text-xs uppercase text-slate-500 border-b border-slate-200">
        <tr>
          <th class="text-left py-1 pr-3">Timestamp</th>
          <th class="text-left py-1 pr-3">Preset</th>
          <th class="text-left py-1 pr-3">Applied</th>
          <th class="text-left py-1 pr-3">Failed</th>
          <th class="text-left py-1 pr-3">Action</th>
        </tr>
      </thead>
      <tbody id="history-tbody">
        <tr><td colspan="5" class="py-2 text-slate-400">履歴を読み込み中...</td></tr>
      </tbody>
    </table>
  </footer>

  <!-- toast container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

  <script src="/static/app.js"></script>
</body>
</html>
