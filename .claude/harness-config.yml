# .claude/harness-config.yml
#
# === Harness Portability Config (Single Source of Truth) ===
#
# 他リポへ移植する際、本ファイル 1 枚を編集すれば全 hook / rule の挙動が連動変化する。
# 直接ハードコードは禁止 (delegation-guard.sh / gateguard.sh / task-rule-guard.sh /
# failure-loop-detect.sh / init-tasks-on-start.sh はすべて config-loader.sh 経由で本値を読む)。
#
# === 環境変数による上書き (env override) ===
# 全キーは `HC_<UPPER_SNAKE>` 形式の環境変数で上書き可能。
# 値解決の優先順 (高 → 低): env > YAML > defaults
#
# 例 (yaml を編集せずに `.env` / shell rc / direnv で切替):
#   export HC_TASK_DIR=docs/tickets
#   export HC_PROTECTED_PATHS=$'app\nlib\nscripts'    # 改行区切り
#   export HC_HOMUNCULUS_ROOT=~/work/homunculus         # tilde 展開対応
#   export HC_CONFIDENCE_REQUIRED=false                 # gate を無効化
#
# 上書き対象キー: docs/PORTABILITY.md の "Env override" セクション参照。
#
# パーサ仕様 (`.claude/hooks/lib/config-loader.sh`):
#   - フラットな key: value
#   - フラットな key: [a, b, c] (インライン JSON-like 配列)
#   - 値内コメント禁止 (行頭 # のみ可)
#   - クォート任意 (シングル / ダブルどちらも strip される)
#   - YAML 完全互換ではない。深いネスト / アンカー / マルチライン文字列は非対応
#
# ## 移植チェックリスト
#  1. protected_paths      → 対象リポのプロダクションコード配置に合わせる
#  2. task_dir / draft_dir → docs/tasks 以外を使う場合
#  3. bash_whitelist_path  → bash-whitelist.txt の置き場所を変える場合
#  4. homunculus_root      → 個人別ストレージ位置 (~/.claude/homunculus 既定)
#  5. その他 path 系       → 非標準の .claude/ 配置を使う場合のみ
#  → 一時的な切替なら yaml を触らず env で済ませる選択肢もある (上記 env override)

# === Harness Version Stamp (task-56 F) ===
# install.sh --init / --update が `date -u +%Y-%m-%d` を書き込む同期 stamp。
# stale-harness-detect.sh (SessionStart hook) が読み、consuming repo が
# `install.sh --update` を取り込まずに旧 harness で稼働継続している事故を WARN する。
# 形式: "YYYY-MM-DD" (UTC)。
# 不正値 (regex 不一致) は UNKNOWN 表示 + 注意 WARN、未来日付は別系 WARN。
# 採用先 project は手動で編集しない (install.sh が更新する)。
harness_version: "2026-05-29"

# === Stale Harness Detect (task-56 F) ===
# .claude/hooks/stale-harness-detect.sh (SessionStart hook) が消費。
# stale_harness_markers: 主要 marker file 一覧 (`.claude/` からの相対 path)。
#   1 件でも欠落していれば旧 harness 稼働の可能性として WARN 注入。
#   採用先で「ハーネス更新の取り込み有無」を間接判定するため、新 guard 追加時に
#   代表的な marker を 5 件程度に保つ (網羅性より代表性を優先)。
# feature_stale_harness_detect_enabled: 機能 on/off (default true、env override 可)
#
# 起源: docs/draft/harness-health-7items-analysis.md §3-F + docs/draft/stale-harness-detection.md
# WARN 出力時は `bash install.sh --update <repo>` 案内 (cross-repo write 例外 §)。
# bypass:
#   export HC_FEATURE_STALE_HARNESS_DETECT_ENABLED=false   # 1 セッション OFF
stale_harness_markers: [CommonRules.md, scripts/hc-config.sh, hooks/lib/config-loader.sh, hooks/loop-confirmation-detector.sh, hooks/stale-harness-detect.sh]
feature_stale_harness_detect_enabled: true

# === 委譲ガードの保護パス ===
# delegation-guard.sh が「メインエージェント直接操作禁止」とみなす path 部分一致リスト。
# 例: protected_paths に "src" が入っていれば */src/* / */src を block する。
# プロダクションコード / テスト / スクリプト等、サブエージェント委譲を強制したい領域を列挙。
protected_paths: [src, tests, scripts]

# === コード実装の保護パス (task-26、subagent 委譲を強制) ===
# delegation-guard.sh が tool=Edit/Write 時、file_path が
# protected_paths_code 配下 かつ code_file_extensions のいずれかに合致するなら BLOCK。
# subagent 経由 (Agent tool) は通過 (既存 agent-marker 判定と同じ)。
#
# 規範文書 (.md) や設定 file (.yml/.json/.txt) は対象外で、メインで編集可。
# bypass: 環境変数 ECC_ALLOW_MAIN_CODE_EDIT=1 (1 セッション、bypass.log 記録)
#
# 起源: 2026-05-23 user 指摘「なぜ基本原則に従ってサブエージェントに移譲しないのですか?」
# 設計: docs/draft/delegation-code-enforcement.md W1
protected_paths_code: [.claude/hooks, .claude/skills, .claude/scripts]
code_file_extensions: [sh, py, mjs, ts, js, tsx, jsx, rb, go, rs, java, kt, swift, php, cpp, c, h]

# === タスク管理ファイル配置 ===
# task-rule-guard.sh / delegation-guard.sh が docs/tasks/ docs/draft/ 規約を判定する基準。
# 値はプロジェクトルートからの相対 path セグメント (slashなし)。
# 例: app/tasks 等にしたい場合は task_dir: "app/tasks" 等に変更。
task_dir: docs/tasks
draft_dir: docs/draft

# === Bash ホワイトリスト ===
# delegation-guard.sh が読む allow-list ファイルの位置 (リポルートからの相対 path)。
bash_whitelist_path: .claude/bash-whitelist.txt

# === Docs 承認済 dir (task-24 W3) ===
# draft-flow-guard.sh が `docs/<value>/foo.md` 形式の Write を pass させる対象 dir。
# 空 (default) なら docs/draft/ 経路のみが approved。CSV 複数値対応 (e.g. "design,research")。
# 起源: docs/draft/taskmanagesystem-recovery.md Q2 (2026-05-23)
#
# 動作例:
#   docs_approved_dir: ""           → docs/foo.md は BLOCK (既存挙動)
#   docs_approved_dir: "design"     → docs/design/foo.md は PASS、docs/foo.md は依然 BLOCK
#   docs_approved_dir: "design,research" → docs/design/foo.md + docs/research/foo.md PASS
#
# 注意:
#   - 深さ 2 (docs/<approved_dir>/foo.md) のみ approved。
#     深さ 3+ (docs/<approved_dir>/sub/nested.md) は元々 hook 対象外で素通り (block されない)。
#   - 既存 docs/draft/ 経路は backward compat 100% (本キーと独立)。
#
# env 上書き例:
#   export HC_DOCS_APPROVED_DIR=design        # 単一 dir
#   export HC_DOCS_APPROVED_DIR=design,research  # CSV 複数値
docs_approved_dir: ""

# === Rule Change Guard (task-40) ===
# draft-flow-guard.sh が消費。.claude/rules/*.md / .claude/commands/*.md / .claude/templates/docs/**/*.md
# への新規 Write 時に対応 draft の approved_at 非空を要求する規範変更 BLOCK 機構。
# 既存 docs/ 直下 block (task-21 W2.3) と独立に enable/disable 可能。
#
# - rule_change_guard_enabled: false で task-40 拡張部のみ完全停止 (docs/ 直下 block は維持)
#
# env 上書き例:
#   export HC_RULE_CHANGE_GUARD_ENABLED=false   # task-40 拡張のみ無効化
rule_change_guard_enabled: true

# === Loop モード確認質問検出 hook (task-41) ===
# Stop hook (.claude/hooks/loop-confirmation-detector.sh) が消費。
# Loop モード稼働中、AI 最終 assistant message を regex 検出し「進めてもよいですか」「OK ですか」
# 「お待ちします」等の確認質問パターンが含まれていれば `<system-reminder>` で次 turn 自律是正を強制。
# Normal モードでは早期 exit (no-op)。
#
# - loop_confirmation_detection_enabled: false で hook 完全停止 (1 セッション、bypass.log 記録)
# - loop_confirmation_patterns: 改行区切り regex リスト。空なら hook 内 default (13 pattern) 使用。
#
# env 上書き例:
#   export HC_LOOP_CONFIRMATION_DETECTION_ENABLED=false
#   export ECC_LOOP_CONFIRMATION_OFF=1   # session-scoped 一時 OFF
#   export HC_LOOP_CONFIRMATION_PATTERNS=$'pattern_1\npattern_2'   # custom regex
#
# 設計起源: docs/draft/loop-confirmation-detector-hook.md §3.3
loop_confirmation_detection_enabled: true
# loop_confirmation_patterns: |
#   custom_pattern_1
#   custom_pattern_2

# === Hook state ディレクトリ ===
# 各 hook が cleared/marker 等の状態を書き出す位置。
# プロジェクトルートからの相対 path。.gitignore で .claude/.* を除外推奨。
gateguard_state_dir: .claude/.gateguard-state
taskguard_state_dir: .claude/.taskguard-state
agent_marker_dir: .claude/.agent-markers
failure_window_dir: .claude/.failure-window

# === 外部ストレージ (continuous-learning v2.1) ===
# observe.sh / harness-audit.py が観察ログを書き出す外部 root。
# tilde (~) や $HOME は config-loader.sh で展開される。
homunculus_root: ~/.claude/homunculus

# === Notification 音源 (macOS のみ) ===
# notify.sh / stop.sh が再生する afplay 対象。非 macOS 環境では無視される。
notify_sound: /System/Library/Sounds/Hero.aiff
stop_sound: /System/Library/Sounds/Glass.aiff

# === Confidence Gate (F3) ===
# SubagentStop hook (.claude/hooks/confidence-gate.sh) が消費。
# サブエージェントが返す completion summary に `confidence: 0.X` を埋め込ませ、
# 閾値未満なら block して早期完了宣言を抑止する SuperClaude 風の self-confidence threshold。
#
# - confidence_threshold: pass の最低値（0.0〜1.0）。0.6 が SuperClaude 既定相当。
# - confidence_required:  true なら未記載で block。false なら未記載でも pass（fail-open 寄り）。
# - confidence_state_dir: bypass marker / bypass.log の保管場所（.gitignore 推奨）。
confidence_threshold: 0.5
confidence_required: false
confidence_state_dir: .claude/.confidence-gate-state

# === 必須環境変数（プロジェクト固有）===
# SessionStart hook (.claude/hooks/check-required-env.sh) が読み、未設定があれば
# stderr に WARN を出してユーザーに通知する（fail-open: 未設定でも session 起動継続）。
#
# 形式: 各エントリは "NAME|severity|purpose" のパイプ区切り文字列。
#   - NAME:     env 変数名（大文字推奨）
#   - severity: error / warn / info
#       error → ❌ MISSING required env: <NAME>（プロジェクト動作に必須）
#       warn  → ⚠️  Recommended env not set: <NAME>（一部機能のみで必要）
#       info  → ℹ️  Optional env not set: <NAME>（dev では optional 等）
#   - purpose:  人間向けの用途説明（日本語可）
#
# パーサ仕様の都合で「フラットなインライン配列」とする。
# プロジェクトで使用する場合は example を参考に編集（既定は空）:
#
# required_env: ["ANTHROPIC_API_KEY|error|Claude API access", "DOCKER_HOST|warn|swebench official harness", "SUPABASE_URL|info|DB access (optional in dev)"]
required_env: []

# === 改善提案 (SessionStart hook で自動提示) ===
# 直近 N 日の observations / hook state を集計して、誤動作パターンと改善案を 1〜N 件提示する。
# 「無視可能な提案」: block しない fail-open 設計。session 起動を遅らせず、stderr に短く出すだけ。
# data 駆動なのでセッション間で内容が変動する（同じ提案は dedup_hours 以内に再度出さない）。
#
# - improvement_proposal_enabled: false で全 SessionStart 提案を停止（hook 自体は exit 0）。
# - improvement_proposal_lookback_days: observations.jsonl を遡って読む日数。
# - improvement_proposal_max_count:  提示する最大件数。多すぎると noisy になる。
# - improvement_proposal_state_dir:  dedup 用の last_shown.json 保管場所（.gitignore 推奨）。
# - improvement_proposal_dedup_hours: 同一提案を再出力するまでの最小時間。
#
# env 上書き例:
#   export HC_IMPROVEMENT_PROPOSAL_ENABLED=false   # 一時的に黙らせる
#   export ECC_IMPROVEMENT_PROPOSAL=off            # hook 内で見る別系統 kill switch
improvement_proposal_enabled: true
improvement_proposal_lookback_days: 7
improvement_proposal_max_count: 3
improvement_proposal_state_dir: .claude/.improvement-proposal-state
improvement_proposal_dedup_hours: 24

# === Context Budget (Loop モード用) ===
# UserPromptSubmit hook (.claude/hooks/context-budget.sh) が消費。
# Loop モード稼働中、context 使用率が閾値を超えた時点で <system-reminder> を
# 注入し、メインに `/save-state` 実行 + セッション再開提案を強制する。Normal モードでは no-op。
#
# - context_budget_enabled:   false で hook を完全停止 (Normal モードと等価動作)
# - context_budget_limit:     context window サイズ (tokens)。
#                             Opus 1M = 1000000 / Sonnet & Haiku 200K = 200000。
#                             モデル切替時は手動更新。
# - context_budget_threshold: 警告開始 ratio (0.0〜1.0)。0.60 = 60% 使用で初回警告。
#                             tier は 60 / 80 / 95 の 3 段階で自動エスカレート。
# - context_budget_state_dir: 警告済み tier marker の保管場所 (.gitignore 推奨)。
#
# env 上書き例:
#   export HC_CONTEXT_BUDGET_LIMIT=200000      # Sonnet/Haiku 使用時
#   export HC_CONTEXT_BUDGET_THRESHOLD=0.50    # 50% で早めに警告
#   export HC_CONTEXT_BUDGET_ENABLED=false     # 一時的に無効化
context_budget_enabled: true
context_budget_limit: 1000000
context_budget_threshold: 0.66
context_budget_state_dir: .claude/.context-budget-state

# === Reviewer Registry (W2 design-review fan-out 用) ===
# `/design-review <slug>` command が読み、カテゴリ別 agent を並列起動する。
# 各キーは agent type name の flat 配列 (config-loader.sh の `[a, b, c]` 構文)。
#
# - reviewer_registry_design:   設計レビュー専門 agent (System / Code / API / UI / DB)
# - reviewer_registry_security: セキュリティレビュー専門
# - reviewer_registry_test:     テスト設計 / QA 専門 (W1 /test-design でも使用)
# - reviewer_registry_impl:     実装レビュー専門 (W3 /module-review /system-review でも使用)
#
# 各カテゴリの実起動範囲は draft の stack heuristic で絞り込まれる
# (例: DB タスクでなければ database-reviewer を skip)。
#
# env 上書き例:
#   export HC_REVIEWER_REGISTRY_DESIGN=$'architect\narchitect-reviewer'  # 2 件に絞る
reviewer_registry_design: [architect, architect-reviewer, code-architect, api-designer, ui-designer, database-reviewer, harness-optimizer]
reviewer_registry_security: [security-auditor, security-reviewer, penetration-tester]
reviewer_registry_test: [tdd-guide, test-automator, qa-expert, pr-test-analyzer]
reviewer_registry_impl: [code-reviewer, refactoring-specialist, typescript-reviewer, python-reviewer, go-reviewer, rust-reviewer, csharp-reviewer, java-reviewer, kotlin-reviewer, cpp-reviewer, flutter-reviewer]

# === Workflow Stages (W4 new-feature / modify-feature 強制用) ===
# workflow-guard.sh が読み、`/finish-task <slug>` 時に
# `.claude/.workflow-state/<slug>.json` の current_stage が以下配列の最終要素に達しているかを判定する。
# stage 名はフラット配列で並べる (step 番号でなく stage 名で判定 — round-2 arch-rev H3 反映)。
#
# - workflow_stages_new:    /new-feature 14-stage オーケストレータ
#   要件定義 → 基本設計 → 詳細設計 → テスト設計 → design-review fan-out →
#   user 承認 → タスク化 → TDD → module-review → ローカルテスト →
#   system-review → CI/CD → シナリオテスト → /finish-task
# - workflow_stages_modify: /modify-feature 10-stage オーケストレータ
#   ブランチ確定 → checkout → 既存設計回収 → pre-test → 設計改修 →
#   テスト改修 → TDD → module-review → 全テスト → system-review
#
# env 上書き例:
#   export HC_WORKFLOW_STAGES_NEW=$'requirements\nbasic-design\n...'   # 改行区切り
workflow_stages_new: [requirements, basic-design, detailed-design, test-design, design-review, user-approval, task-creation, tdd, module-review, local-test, system-review, ci-cd, scenario-test, finish]
workflow_stages_modify: [branch-decision, checkout, recover-design, pre-test, redesign, retest-design, tdd, module-review, full-test, system-review]

# === list-md plan-first reminder (task-35) ===
# SessionStart hook .claude/hooks/list-md-plan-first-reminder.sh が消費。
# `docs/draft/*.md` ≥ 3 件 ∧ `docs/tasks/list.md` task エントリ行 == 0 を検出した場合、
# <system-reminder> で「経路 B (batch planning) 適用検討」を stderr 強制注入する。
#
# 実装 (task-35、案 B 採用 — 責務分離 + 単体 smoke 容易化):
#   - hook:     .claude/hooks/list-md-plan-first-reminder.sh (約 100 LOC、fail-open guard 含む)
#   - smoke:    .claude/tests/list-md-plan-first-reminder-smoke.sh (6 cases)
#   - 配線:    .claude/settings.json SessionStart (wrapper.sh 後配置、wrapper failure 時の独立発火維持)
#   - 起源:    task-33 採用 6 条 supersede で task-35 へ分割
#
# - list_plan_first_reminder_enabled: false で reminder を完全停止
# - 検出ロジック: grep -cE '^\| [0-9]' で task 行カウント、find -maxdepth 1 -name "*.md" -not -name "_*" で draft 件数
# - fail-open guard: list.md or docs/draft 不在 → silent exit 0 (新規採用 project で誤発火しない)
#
# env 上書き例:
#   export HC_LIST_PLAN_FIRST_REMINDER_ENABLED=false   # 一時的に黙らせる
list_plan_first_reminder_enabled: true

# === Parallel Subagent Reminder (task #38) ===
# PreToolUse(Agent) hook (.claude/hooks/parallel-subagent-reminder.sh) が消費。
# subagent 起動時に以下 2 観点で <system-reminder> を注入する (BLOCK しない、fail-open):
#
#   (A) 並列性 reminder: 直近 TTL 秒内に他 Agent 起動なし、かつ task description に
#       並列性 keyword (実装/fix/refactor/設計/新設/拡張/改修) を含む場合、
#       「並列起動を検討せよ」warning を注入。除外: reviewer/review/監査/audit。
#   (B) agent type 選定 reminder: subagent_type == "general-purpose" かつ
#       task description に専門 type 適合 keyword (smoke 拡張/test 追加/refactor 等)
#       を含む場合、「専門 type 推奨」warning を注入。
#
# - parallel_subagent_reminder_enabled: false で reminder 完全停止 (bypass)
# - parallel_subagent_ttl_sec:          state file TTL (秒)、env override で変更可
#
# agent_type_keyword_mapping は draft §4.5.0 設定不要原則により hook 内 hardcode default
# を採用。採用者は yaml 編集なしで動作する。任意 override したい場合のみ環境変数
# HC_AGENT_TYPE_KEYWORD_MAPPING で改行区切り "keyword|type" 形式を渡す。
#
# 起源:
#   - 設計 draft: docs/draft/parallel-subagent-enforcement.md §4.2-4.5
#   - task:       docs/tasks/task-38-parallel-subagent-enforcement.md Step 1
#
# env 上書き例:
#   export HC_PARALLEL_SUBAGENT_REMINDER_ENABLED=false   # 一時的に黙らせる
#   export HC_PARALLEL_SUBAGENT_TTL_SEC=600              # TTL 10 分に延長
#   export HC_AGENT_TYPE_KEYWORD_MAPPING="smoke 拡張|tdd-guide,refactor|refactoring-specialist"
#                                                        # advanced: keyword → agent type マッピング override
#                                                        # (default は hook 内 hardcode、設定不要原則で動作)
#
# 注意: agent_type_keyword_mapping は yaml multi-line value 非対応のため
# yaml 設定は **非推奨** (advanced 用途)、env 経由 override 推奨。
# 設定不要原則 (draft §4.5.0) により hook 内 hardcode default が動作。
parallel_subagent_reminder_enabled: true
parallel_subagent_ttl_sec: 300

# parallel_subagent_state_dir: state file 保存 dir の任意 override (テスト isolation 用)。
# default 空文字 → hook 内 fallback (`$repo_root/.claude/.parallel-subagent-state/`) を使用。
# 設定不要原則 (draft §4.5.0) で hook 内 fallback 動作するため、通常運用は yaml 設定不要。
# テスト / CI で isolation したい場合のみ設定:
#   parallel_subagent_state_dir: "/tmp/my-isolated-state"
# env 上書き例:
#   export HC_PARALLEL_SUBAGENT_STATE_DIR=/tmp/parallel-state-test

# === Feature Toggles (機能単位 on/off、Phase 2 で hook level 上位 layer) ===
# 各 feature key は **上位 layer**、関連 hook の `HC_<HOOK>_ENABLED` は subordinate。
# feature 単位で OFF にすれば、hook level に関わらず全 hook 停止 (feature 内 hook 一括 OFF)。
# 設計起源: docs/draft/config-yml-feature-toggles-and-editor.md §3.1.2 (task-44)
#
# Phase 1 (本 commit): yml schema 拡張のみ、各 hook での feature check は Phase 2 で追加。
# 各 key が false でも本 Phase では hook 動作は変わらない (yml schema 追加のみ)。
#
# env 上書き例:
#   export HC_FEATURE_LOOP_MODE_ENFORCEMENT_ENABLED=false   # Loop モード 3 hook を一括 OFF
#   export HC_FEATURE_DRAFT_FLOW_GUARD_ENABLED=false        # draft-flow-guard OFF

feature_loop_mode_enforcement_enabled: true       # loop-confirmation-detector + loop-auto-progress-reminder + mode-enforce
feature_draft_flow_guard_enabled: false            # draft-flow-guard
feature_task_rule_guard_enabled: false
feature_delegation_guard_enabled: true            # delegation-guard
feature_workflow_enforcement_enabled: false
feature_confidence_gate_enabled: true             # confidence-gate (F3)
feature_gateguard_enabled: false
feature_context_budget_enabled: true              # context-budget
feature_parallel_subagent_reminder_enabled: true  # parallel-subagent-reminder
feature_reviewer_count_guard_enabled: true     # reviewer-count-guard (task-64 Step 5)
feature_autonomous_action_guard_enabled: true     # autonomous-action-guard
feature_byproduct_discharge_enabled: true         # byproduct-discharge-guard + next-actions-surface
feature_why_x5_enforcement_enabled: true          # why-x5-reminder + why-x5-violation-detect
feature_session_help_surface_enabled: true        # session-help-surface
feature_improvement_proposal_enabled: true        # improvement-proposal
feature_mode_session_start_enabled: true          # mode-session-start
feature_check_serena_mcp_enabled: true            # check-serena-mcp
feature_check_required_env_enabled: true          # check-required-env
feature_init_tasks_on_start_enabled: true         # init-tasks-on-start
feature_notify_enabled: true                      # notify + stop (sound)
feature_check_md_mermaid_enabled: true            # check-md-mermaid
feature_failure_loop_detect_enabled: true         # failure-loop-detect

# hc-config.sh interactive の TUI legacy fallback (task-61 Step 5 iter 2 D)
# 対象: .claude/scripts/hc-config.sh の cmd_interactive dispatcher (L1782 周辺)
#   true:           task-60 で実装した TUI (3-state machine + sel scalar 7 var) を起動
#   false (default): task-61 で実装した Web UI (Node.js HTTP server + browser) を起動
# 互換性:
#   - legacy compat env HC_HC_CONFIG_TUI_LEGACY=true (Step 1 起源、commit 81a156e) も維持
#   - dispatcher は両者を OR 結合判定 (どちらかが true なら TUI fallback)
# 起源: docs/draft/hc-config-web-ui.md §3 + task-61 Step 5 iter 1 qa-expert H-Q2 (yml 集中管理欠落)
# bypass: HC_FEATURE_HC_CONFIG_TUI_LEGACY_ENABLED=true で 1 セッション TUI 強制
feature_hc_config_tui_legacy_enabled: false

# === Reviewer Required / Min Count / Iteration (採用 6 条 4 reviewer 制御) ===
# /design-review / /test-design / /module-review / /system-review command が消費 (Phase 2)。
# yml 値 default で動作、env override 可 (HC_REVIEW_*)。
# 設計起源: docs/draft/config-yml-feature-toggles-and-editor.md §3.1.1 (task-44)
#
# === project override は harness-config.local.yml に移行済 (task-64 Step 2) ===
# 下記 review_* 値は SSoT (本 file) と harness-config.local.yml の両方に存在する。
# config-loader.sh は local.yml を SSoT より優先 (Step 3.5) するため、hook / command が
# 消費する実効値は local.yml 由来となる。本 file の値は install.sh --update で harness
# default に戻されても、local.yml 側 (rsync 除外で温存) が project 値を維持する。
# project 値を変えたい場合は harness-config.local.yml を編集すること
# (SSoT の本 file を編集しても --update で上書きされる)。root cause E 解消 (task-64)。
#
# Phase 1 (本 commit): yml schema 拡張のみ、各 review command での参照 logic は Phase 2 で追加。
# 本 Phase では値変更しても review command 動作は変わらない (yml schema 追加のみ)。
#
# env 上書き例:
#   export HC_REVIEW_REQUIRED_DESIGN=false           # /design-review を no-op skip
#   export HC_REVIEW_MIN_COUNT_TEST=3                # テスト設計レビュー min 3 体
#   export HC_REVIEW_ITERATION_MAX=3                 # 反復上限 3 回

# 設計レビュー (W2 /design-review)
review_required_design: false
review_min_count_design: 1
review_max_count_design: 7            # default registry 全件、上限指定

# テスト設計レビュー (W1 /test-design、採用 6 条 4)
review_required_test: false
review_min_count_test: 1
review_max_count_test: 10             # default registry 全件、上限指定

# モジュールレビュー (W3 /module-review)
review_required_module: false
review_min_count_module: 2            # default 2 (code-reviewer + refactoring-specialist)
review_max_count_module: 5            # default registry 全件、上限指定

# システムレビュー (W3 /system-review)
review_required_system: false
review_min_count_system: 2            # default 2 (architect-reviewer + refactoring-specialist)
review_max_count_system: 5            # default registry 全件、上限指定

# security レビュー (W2 /design-review 内 security category)
review_required_security: false       # default false (security 影響 task のみ)
review_min_count_security: 1          # default 1 (security-reviewer)

# 反復制御
review_iteration_max: 2               # default 5 (採用 6 条 4 で 5 回上限、現在値: task-61 作業中に変更)